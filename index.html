<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Days Counter</title>
  <meta name="description" content="Tap the circle to add a day. The waves get stronger and the colour gets hotter the longer your streak runs.">
  <meta name="theme-color" content="#0b0c0f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Unbounded:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="waves" aria-hidden="true"></canvas>

  <div class="app">
    <header class="bar">
      <p class="brand">Days Counter</p>
      <div class="tools" id="tools">
        <p class="best">Best <span id="best">0</span></p>
        <button type="button" class="chip" id="undo" aria-label="Remove one day">&minus;1</button>
        <button type="button" class="chip" id="reset">Reset</button>
      </div>
      <div class="tools" id="confirm" hidden>
        <p class="best">Reset to 0?</p>
        <button type="button" class="chip chip-danger" id="confirm-yes">Reset</button>
        <button type="button" class="chip" id="confirm-no">Cancel</button>
      </div>
    </header>

    <main class="stage">
      <div class="aura" aria-hidden="true"></div>
      <button type="button" class="dial" id="dial" aria-label="Add a day">
        <span class="count" id="count" data-len="1">0</span>
        <span class="unit" id="unit">days</span>
      </button>
      <p class="toast" id="toast" aria-hidden="true"></p>
    </main>

    <section class="info">
      <p class="tier" id="tier">Cold start</p>
      <p class="msg" id="msg" aria-live="polite">Tap the circle to add your first day.</p>
      <div class="track" aria-hidden="true">
        <div class="track-bar" id="track-bar">
          <div class="track-lock"></div>
          <div class="track-dot"></div>
        </div>
        <ol class="ticks" id="ticks"></ol>
      </div>
      <p class="next" id="next"></p>
      <p class="foot" id="foot">
        <span id="save-status" role="status">Saved in this browser</span>
        <span aria-hidden="true">·</span>
        <button type="button" class="link" id="edit">Set count</button>
      </p>
      <form class="edit" id="edit-form" hidden>
        <label for="edit-input">Days</label>
        <input id="edit-input" name="days" type="number" inputmode="numeric" min="0" max="99999" step="1" required>
        <button type="submit" class="chip chip-solid">Save</button>
        <button type="button" class="chip" id="edit-cancel">Cancel</button>
      </form>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
